name: Build check
on:
  pull_request:
    branches: [uat/main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: build-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
